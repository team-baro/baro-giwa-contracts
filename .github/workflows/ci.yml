name: contracts

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_fork_tests:
        description: "Run the read-only GIWA fork integration test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.5.1
      - run: forge clean
      - run: forge fmt --check
      - run: forge lint
      - run: forge build --sizes
      - run: forge test --force -vvv
      - run: scripts/check-coverage.sh
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test/tooling -v
      - run: python3 tools/export_integration.py --check
      - if: github.event_name == 'workflow_dispatch' && inputs.run_fork_tests
        run: BARO_RUN_FORK_TESTS=true forge test --match-contract GIWAPhase4ForkTest -vv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          fail-on: medium
          slither-version: 0.11.5
          slither-args: --exclude-dependencies --filter-paths "lib|test|script"
