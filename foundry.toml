[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[lint]
# Canonical EIP-712 hashing uses abi.encode; inline assembly would reduce auditability here.
exclude_lints = ["asm-keccak256"]

[rpc_endpoints]
giwa_sepolia = "${GIWA_SEPOLIA_RPC_URL}"
